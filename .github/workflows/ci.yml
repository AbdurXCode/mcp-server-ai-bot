name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Check code formatting with black
      run: |
        pip install black
        black --check --line-length 100 app
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy app --ignore-missing-imports || true
    
    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r app -f json -o bandit-report.json || true
    
    - name: Test server startup
      run: |
        # Create dummy .env file for testing
        echo "API_KEY=test_key" > .env
        echo "GEMINI_API_KEY=test_key" >> .env
        echo "API_URL=https://test.com" >> .env
        # Test import
        python -c "from app.main import app; print('Server imports successfully')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t mcp-llm-server:${{ github.sha }} .
      if: false  # Enable when Dockerfile is added

